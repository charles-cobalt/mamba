/*CAP: saved capitalization formatting. Titles/names title case; notes/descriptions sentence case. *...* kept verbatim.*/
const CAPKT=new Set('MNQ NQ ES MES YM MYM RTY CL GC SI HG ZB ZN SPX NDX DJI VIX DXY EUR USD GBP JPY AUD CAD NZD CHF GDP CPI PPI NFP FOMC ATR OTE RTH ETH ICT SMT FVG BOS USDA ON AM PM R'.split(' ')),CAPKS=new Set([...CAPKT].filter(x=>x!=='ON')),CAPSM=new Set('a an and as at but by for in nor of on or per so the to vs via with de la el'.split(' '));
function capProt(w,sent){const c=String(w).replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g,'');if(!c)return w;
 if(/\d/.test(c))return w;
 const up=c.toUpperCase();if((sent?CAPKS:CAPKT).has(up))return w.replace(c,up);
 if(/[a-z]/.test(c)&&/[A-Z]/.test(c.slice(1)))return w;
 if(/^[A-Z][A-Z+]*\+$/.test(c))return w;

 const total=parts.reduce((a,p,pi)=>a+(pi%2?0:p.split(/\s+/).filter(Boolean).length),0);let k=0;
 return parts.map((p,pi)=>{if(pi%2)return p;
