", "The second most important thing in life is good health.\nWithout it, it's all you'll wish for.\nHealth is what buys you time.\nYou can't live a life you won't be around for.", "The third most important thing in life is having people to share memories with.\nMemories are all we have,\nand life is worth living and creating memories for,\nbut only with people to share them with."]}, {"title": "Samwise Gamgee", "paragraphs": ["It's like in the great stories, Mr. Frodo. The ones that really mattered. Full of darkness, and danger, they were. And sometimes you didn't want to know the end, because how could the end be happy? How could the world go back to the way it was when so much bad had happened? But in the end, it's only a passing thing, this shadow. Even darkness must pass. A new day will come. And when the sun shines, it'll shine out the clearer. Those were the stories that stayed with you. That meant something. Even if you were too small to understand why. But I think, Mr. Frodo, I do understand. I know now. Folk in those stories had lots of chances of turning back, only they didn't. They kept going. Because they were holding on to something. (What are we holding on to, Sam?) That there's some good in this world, Mr. Frodo... and it's worth fighting for."]}],trigger=document.getElementById('anecdoteTrigger'),overlay=document.getElementById('anecdoteOverlay'),title=document.getElementById('anecdoteTitle'),text=document.getElementById('anecdoteText');
